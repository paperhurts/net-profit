<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="A cosy isometric fishing tycoon prototype: tow the net, haul the catch, build up the boat.">
<title>Net Profit</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#2B8A99">
<meta property="og:title" content="Net Profit">
<meta property="og:description" content="A cosy isometric fishing tycoon. Tow the net, haul the catch, build up the boat.">
<meta property="og:image" content="https://paperhurts.github.io/net-profit/og.jpg">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --font:"Grandstander",ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --abyss:#1B6676;
  --pill-bg:#FFF6E5; --pill-fg:#12303A; --pill-shadow:rgba(10,40,50,.35);
  --plank:#D39C5C; --plank-line:rgba(90,50,10,.16); --plank-edge:#8F5F2C; --plank-fg:#2A1A08;
  --card:#FFF6E5; --card-fg:#12303A; --muted:#5C7077;
  --buoy:#E4572E; --buoy-fg:#FFF6E5; --coin:#FFC53D; --coin-edge:#C98A12;
  --track:rgba(18,48,58,.16); --fill:#2B8A99;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --abyss:#0A1E30;
    --pill-bg:#10293A; --pill-fg:#F1EBDA; --pill-shadow:rgba(0,0,0,.5);
    --plank:#6E4A2A; --plank-line:rgba(0,0,0,.22); --plank-edge:#3F2912; --plank-fg:#F6E6C8;
    --card:#17364A; --card-fg:#F1EBDA; --muted:#9DB4BC;
    --track:rgba(255,255,255,.14); --fill:#5BBFB5;
  }
}
:root[data-theme="dark"]{
  --abyss:#0A1E30;
  --pill-bg:#10293A; --pill-fg:#F1EBDA; --pill-shadow:rgba(0,0,0,.5);
  --plank:#6E4A2A; --plank-line:rgba(0,0,0,.22); --plank-edge:#3F2912; --plank-fg:#F6E6C8;
  --card:#17364A; --card-fg:#F1EBDA; --muted:#9DB4BC;
  --track:rgba(255,255,255,.14); --fill:#5BBFB5;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{background:var(--abyss);color:var(--pill-fg);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--coin);outline-offset:2px}

.hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;pointer-events:none;
  padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left))}
.pill{pointer-events:auto;background:var(--pill-bg);color:var(--pill-fg);border-radius:999px;height:40px;padding:0 14px;
  display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;line-height:1;box-shadow:0 3px 0 var(--pill-shadow)}
.pill span{padding-top:3px}
.coin{width:20px;height:20px;border-radius:50%;background:var(--coin);border:2.5px solid var(--coin-edge);flex:none}
.hold{flex:1;max-width:280px;min-width:0}
.hold svg{flex:none}
.track{flex:1;height:12px;border-radius:99px;background:var(--track);overflow:hidden;min-width:20px}
.track i{display:block;height:100%;width:0;border-radius:99px;background:var(--fill);transition:width .15s}
.hold.full .track i{background:var(--buoy)}
.hold.full{animation:nudge .9s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(2px)}}
.spacer{flex:0 0 0;margin-left:auto}
.icon{width:40px;padding:0;justify-content:center;font-size:20px}
.icon.off{opacity:.55;text-decoration:line-through}
.icon.label{width:auto;padding:0 12px;font-size:14px;font-weight:700;white-space:nowrap}
.pill[hidden]{display:none}
.icon.sure{width:auto;padding:0 12px;font-size:14px;background:var(--buoy);color:var(--buoy-fg)}

#toast{position:fixed;left:50%;top:calc(100px + env(safe-area-inset-top));transform:translate(-50%,-8px);opacity:0;
  transition:opacity .2s,transform .2s;pointer-events:none;background:var(--pill-bg);color:var(--pill-fg);
  border-radius:14px;padding:9px 14px 6px;font-weight:700;font-size:15px;line-height:1.25;text-align:center;
  max-width:min(86vw,360px);box-shadow:0 3px 0 var(--pill-shadow)}
#toast.show{opacity:1;transform:translate(-50%,0)}

.planks{background:var(--plank) repeating-linear-gradient(0deg,transparent 0 21px,var(--plank-line) 21px 23px);
  color:var(--plank-fg);border:3px solid var(--plank-edge);border-radius:16px;box-shadow:0 5px 0 var(--plank-edge)}

#shop{position:fixed;left:0;right:0;bottom:0;pointer-events:none;transform:translateY(115%);
  transition:transform .3s cubic-bezier(.2,.9,.3,1.08);
  padding:0 calc(10px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left))}
#shop.open{transform:none;pointer-events:auto}
#shop .planks{max-width:560px;margin:0 auto;padding:10px}
#shop h2{font-size:16px;font-weight:800;margin:2px 4px 8px;line-height:1}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.up{background:var(--card);color:var(--card-fg);border-radius:11px;padding:9px 8px 8px;text-align:left;
  display:flex;flex-direction:column;gap:5px;box-shadow:0 3px 0 rgba(0,0,0,.22);min-width:0}
.up:active:not([aria-disabled="true"]){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.up b{font-size:15px;font-weight:800;line-height:1.05}
.up small{font-size:12.5px;font-weight:500;color:var(--muted);line-height:1.2;min-height:30px}
.pips i{min-width:0}
.pips{display:flex;gap:3px}
.pips i{width:100%;height:5px;border-radius:9px;background:var(--track)}
.pips i.on{background:var(--fill)}
.buy{margin-top:auto;background:var(--buoy);color:var(--buoy-fg);border-radius:8px;font-weight:800;font-size:13px;
  padding:7px 4px 4px;text-align:center;line-height:1}
.up[aria-disabled="true"] .buy{background:var(--track);color:var(--muted)}
.up[aria-disabled="true"]{cursor:default}

#shop h2 span{font-weight:500;font-size:13px;opacity:.8;margin-left:6px}
.swatches{display:flex;gap:7px;margin:10px 2px 0;flex-wrap:wrap}
.sw{width:27px;height:27px;border-radius:50%;border:3px solid;box-shadow:0 2px 0 rgba(0,0,0,.25);flex:none}
.sw.sel{outline:3px solid var(--coin);outline-offset:1px}
.sw[aria-disabled="true"]{opacity:.28;cursor:default}
.log{display:flex;gap:5px;margin:9px 2px 0;overflow-x:auto;scrollbar-width:none}
.log::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:4px;background:var(--card);color:var(--card-fg);border-radius:99px;padding:5px 8px 2px;font-size:12.5px;font-weight:700;flex:none;line-height:1}
.chip svg{margin-top:-3px}
.chip.unk{opacity:.5}
.chip.gold{box-shadow:inset 0 0 0 2px var(--coin)}
#order{position:fixed;left:calc(12px + env(safe-area-inset-left));top:calc(58px + env(safe-area-inset-top));pointer-events:none;
  background:var(--pill-bg);color:var(--pill-fg);border-radius:12px;padding:7px 11px 4px;font-size:13.5px;font-weight:700;line-height:1;
  display:flex;gap:7px;align-items:center;box-shadow:0 2px 0 var(--pill-shadow);max-width:calc(100vw - 24px)}
#order svg{margin-top:-3px;flex:none}
#order{max-width:calc(100vw - 178px)}
#order span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rchips{position:fixed;right:calc(12px + env(safe-area-inset-right));top:calc(58px + env(safe-area-inset-top));pointer-events:none;display:flex;gap:6px}
#phase i{width:10px;height:10px;border-radius:50%;margin-top:-3px}
#wood,#phase{
  background:var(--pill-bg);color:var(--pill-fg);border-radius:12px;padding:7px 11px 4px;font-size:13.5px;font-weight:800;line-height:1;
  display:flex;gap:6px;align-items:center;box-shadow:0 2px 0 var(--pill-shadow)}
#wood svg{margin-top:-3px}
.build{width:100%;margin-top:8px;background:var(--card);color:var(--card-fg);border-radius:11px;padding:9px 8px 8px 10px;text-align:left;
  display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 3px 0 rgba(0,0,0,.22)}
.build > span:first-child{display:flex;flex-direction:column;gap:3px;min-width:0}
.build b{font-size:15px;font-weight:800;line-height:1.05}
.build small{font-size:12.5px;font-weight:500;color:var(--muted);line-height:1.2}
.build .buy{margin:0;padding:8px 10px 5px;flex:none;max-width:48%;line-height:1.15}
.build[aria-disabled="true"] .buy{background:var(--track);color:var(--muted)}
.build[aria-disabled="true"]{cursor:default}
.build:active:not([aria-disabled="true"]){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
#order b{font-weight:800;opacity:.7}
#intro{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:rgba(8,30,40,.35)}
#intro.gone{display:none}
#intro .planks{max-width:340px;padding:22px 20px 18px;text-align:center}
#intro h1{font-size:40px;font-weight:800;line-height:.95;letter-spacing:-.5px;margin-bottom:12px}
#intro p{font-size:16px;font-weight:500;line-height:1.35;margin-bottom:6px}
#intro .go{margin-top:12px;background:var(--buoy);color:var(--buoy-fg);font-weight:800;font-size:18px;
  padding:13px 26px 9px;border-radius:12px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#intro .go:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
#intro .keys{font-size:13px;opacity:.75;margin:10px 0 0}
@media (hover:none){#intro .keys{display:none}}
@media (prefers-reduced-motion: reduce){.hold.full{animation:none}#shop,#toast,.track i{transition:none}}
</style>
</head>
<body>
<canvas id="sea" aria-label="Fishing game. Steer the boat, tow the net through fish, return to the dock."></canvas>

<div class="hud">
  <div class="pill" title="Coins"><i class="coin"></i><span id="coins">0</span></div>
  <div class="pill hold" id="holdPill" title="Hold">
    <svg width="22" height="14" viewBox="0 0 22 14" aria-hidden="true"><path d="M1 7c3-5 9-7 14-3l5-3v12l-5-3C10 14 4 12 1 7z" fill="currentColor"/></svg>
    <span id="holdTxt">0/12</span>
    <div class="track"><i id="holdBar"></i></div>
  </div>
  <div class="spacer"></div>
  <button class="pill icon label" id="keys" aria-label="Keys drive the boat" title="Keyboard steering" hidden>⌨ drive</button>
  <button class="pill icon" id="snd" aria-label="Sound on" title="Sound">♪</button>
  <button class="pill icon" id="rst" aria-label="Start over" title="Start over">↻</button>
</div>

<div id="order" aria-live="polite"></div>
<div id="rchips"><div id="phase"></div><div id="wood" title="Driftwood"></div></div>
<div id="toast" role="status"></div>

<section id="shop" aria-hidden="true" aria-label="Upgrades">
  <div class="planks">
    <h2>Upgrades <span id="tierTxt"></span></h2>
    <div class="row">
      <button class="up" data-k="net"><b>Wider net</b><div class="pips"></div><small></small><div class="buy"></div></button>
      <button class="up" data-k="hold"><b>Bigger hold</b><div class="pips"></div><small></small><div class="buy"></div></button>
      <button class="up" data-k="engine"><b>Faster engine</b><div class="pips"></div><small></small><div class="buy"></div></button>
    </div>
    <button class="build" id="build"></button>
    <div class="swatches" id="paints" role="group" aria-label="Paint"></div>
    <div class="log" id="log" aria-label="Catch log"></div>
  </div>
</section>

<div id="intro">
  <div class="planks">
    <h1>Net Profit</h1>
    <p>Drag anywhere to steer.</p>
    <p>Tow your net through the fish.</p>
    <p>Sail back to the dock to sell and upgrade.</p>
    <button class="go" id="go">Cast off</button>
    <p class="keys">Arrow keys and WASD work too.</p>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
