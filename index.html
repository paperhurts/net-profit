<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="A cosy isometric fishing tycoon prototype: tow the net, haul the catch, build up the boat.">
<title>Net Profit</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#2B8A99">
<meta property="og:title" content="Net Profit">
<meta property="og:description" content="A cosy isometric fishing tycoon. Tow the net, haul the catch, build up the boat.">
<meta property="og:image" content="https://net-profit.paperhurts.dev/og.jpg">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --font:"Grandstander",ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --abyss:#1B6676;
  --pill-bg:#FFF6E5; --pill-fg:#12303A; --pill-shadow:rgba(10,40,50,.35);
  --plank:#D39C5C; --plank-line:rgba(90,50,10,.16); --plank-edge:#8F5F2C; --plank-fg:#2A1A08;
  --card:#FFF6E5; --card-fg:#12303A; --muted:#5C7077;
  --buoy:#E4572E; --buoy-fg:#FFF6E5; --coin:#FFC53D; --coin-edge:#C98A12;
  --track:rgba(18,48,58,.16); --fill:#2B8A99;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --abyss:#0A1E30;
    --pill-bg:#10293A; --pill-fg:#F1EBDA; --pill-shadow:rgba(0,0,0,.5);
    --plank:#6E4A2A; --plank-line:rgba(0,0,0,.22); --plank-edge:#3F2912; --plank-fg:#F6E6C8;
    --card:#17364A; --card-fg:#F1EBDA; --muted:#9DB4BC;
    --track:rgba(255,255,255,.14); --fill:#5BBFB5;
  }
}
:root[data-theme="dark"]{
  --abyss:#0A1E30;
  --pill-bg:#10293A; --pill-fg:#F1EBDA; --pill-shadow:rgba(0,0,0,.5);
  --plank:#6E4A2A; --plank-line:rgba(0,0,0,.22); --plank-edge:#3F2912; --plank-fg:#F6E6C8;
  --card:#17364A; --card-fg:#F1EBDA; --muted:#9DB4BC;
  --track:rgba(255,255,255,.14); --fill:#5BBFB5;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{background:var(--abyss);color:var(--pill-fg);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--coin);outline-offset:2px}

body.cine .hud,body.cine #order,body.cine #rchips,body.cine #toast{opacity:0;transition:opacity .4s}
body.inside #order,body.inside #holdPill,body.inside #hull,body.inside #market,body.inside #wood{display:none}
.hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;pointer-events:none;
  padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left))}
.pill{pointer-events:auto;background:var(--pill-bg);color:var(--pill-fg);border-radius:999px;height:40px;padding:0 14px;
  display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;line-height:1;box-shadow:0 3px 0 var(--pill-shadow)}
.pill span{padding-top:3px}
.coin{width:20px;height:20px;border-radius:50%;background:var(--coin);border:2.5px solid var(--coin-edge);flex:none}
.hold{flex:1;max-width:280px;min-width:0}
.hold svg{flex:none}
.track{flex:1;height:12px;border-radius:99px;background:var(--track);overflow:hidden;min-width:20px}
.track i{display:block;height:100%;width:0;border-radius:99px;background:var(--fill);transition:width .15s}
.hold.full .track i{background:var(--buoy)}
.hold.full{animation:nudge .9s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(2px)}}
.spacer{flex:0 0 0;margin-left:auto}
.icon{width:40px;padding:0;justify-content:center;font-size:20px}
.icon.off{opacity:.55;text-decoration:line-through}
.icon.label{width:auto;padding:0 12px;font-size:14px;font-weight:700;white-space:nowrap}
.pill[hidden]{display:none}
.icon.sure{width:auto;padding:0 12px;font-size:14px;background:var(--buoy);color:var(--buoy-fg)}

#toast{position:fixed;left:50%;top:calc(140px + env(safe-area-inset-top));transform:translate(-50%,-8px);opacity:0;
  transition:opacity .2s,transform .2s;pointer-events:none;background:var(--pill-bg);color:var(--pill-fg);
  border-radius:14px;padding:9px 14px 6px;font-weight:700;font-size:15px;line-height:1.25;text-align:center;
  max-width:min(86vw,360px);box-shadow:0 3px 0 var(--pill-shadow)}
#toast.show{opacity:1;transform:translate(-50%,0)}

.planks{background:var(--plank) repeating-linear-gradient(0deg,transparent 0 21px,var(--plank-line) 21px 23px);
  color:var(--plank-fg);border:3px solid var(--plank-edge);border-radius:16px;box-shadow:0 5px 0 var(--plank-edge)}

#shop{position:fixed;left:0;right:0;bottom:0;pointer-events:none;transform:translateY(115%);
  transition:transform .3s cubic-bezier(.2,.9,.3,1.08), opacity .15s;
  padding:0 calc(10px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left))}
#shop.open{transform:none;pointer-events:auto;touch-action:none}
#shop.steer{opacity:.25}
#shop .planks{max-width:560px;margin:0 auto;padding:10px}
#shop h2{font-size:16px;font-weight:800;margin:2px 4px 8px;line-height:1}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row[hidden]{display:none}
.up{background:var(--card);color:var(--card-fg);border-radius:11px;padding:9px 8px 8px;text-align:left;
  display:flex;flex-direction:column;gap:5px;box-shadow:0 3px 0 rgba(0,0,0,.22);min-width:0}
.up:active:not([aria-disabled="true"]){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.up b{font-size:15px;font-weight:800;line-height:1.05}
.up small{font-size:12.5px;font-weight:500;color:var(--muted);line-height:1.2;min-height:30px}
.gearrow{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 8px;margin-top:8px}
.gearrow[hidden]{display:none}
.gearhead{grid-column:1 / -1;font-size:13px;font-weight:800;opacity:.85;margin:0 4px}
.gear{background:var(--card);color:var(--card-fg);border-radius:11px;padding:8px 8px 7px;text-align:left;
  display:grid;grid-template-columns:1fr auto;gap:3px 8px;align-items:center;box-shadow:0 3px 0 rgba(0,0,0,.22);min-width:0}
.gear:active:not([aria-disabled="true"]){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.gear b{font-size:14px;font-weight:800;line-height:1.05}
.gear small{grid-column:1 / -1;font-size:12px;font-weight:500;color:var(--muted);line-height:1.2}
.gear .buy{margin:0;padding:6px 8px 3px;font-size:12.5px}
.gear[aria-disabled="true"] .buy{background:var(--track);color:var(--muted)}
.gear[aria-disabled="true"]{cursor:default}
/* While the upgrade cards are showing, the shelf is a line a card; a tap says what each piece does. */
.row:not([hidden]) ~ .gearrow small{display:none}
.pips i{min-width:0}
.pips{display:flex;gap:3px}
.pips i{width:100%;height:5px;border-radius:9px;background:var(--track)}
.pips i.on{background:var(--fill)}
.buy{margin-top:auto;background:var(--buoy);color:var(--buoy-fg);border-radius:8px;font-weight:800;font-size:13px;
  padding:7px 4px 4px;text-align:center;line-height:1}
.up[aria-disabled="true"] .buy{background:var(--track);color:var(--muted)}
.up[aria-disabled="true"]{cursor:default}

#shop h2 span{font-weight:500;font-size:13px;opacity:.8;margin-left:6px}
.swatches{display:flex;gap:7px;margin:10px 2px 0;flex-wrap:wrap}
.sw{width:27px;height:27px;border-radius:50%;border:3px solid;box-shadow:0 2px 0 rgba(0,0,0,.25);flex:none}
.sw.sel{outline:3px solid var(--coin);outline-offset:1px}
.sw[aria-disabled="true"]{opacity:.28;cursor:default}
.log{display:flex;gap:5px;margin:9px 2px 0;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
.log::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:4px;background:var(--card);color:var(--card-fg);border-radius:99px;padding:5px 8px 2px;font-size:12.5px;font-weight:700;flex:none;line-height:1}
.chip svg{margin-top:-3px}
.chip.unk{opacity:.5}
.chip.gold{box-shadow:inset 0 0 0 2px var(--coin)}
#order{position:fixed;left:calc(12px + env(safe-area-inset-left));top:calc(58px + env(safe-area-inset-top));pointer-events:none;
  background:var(--pill-bg);color:var(--pill-fg);border-radius:12px;padding:7px 11px 4px;font-size:13.5px;font-weight:700;line-height:1;
  display:flex;gap:7px;align-items:center;box-shadow:0 2px 0 var(--pill-shadow);max-width:calc(100vw - 24px)}
#order svg{margin-top:-3px;flex:none}
#order{max-width:calc(100vw - 198px)}
#order span{line-height:1.15}
#rchips{position:fixed;right:calc(12px + env(safe-area-inset-right));top:calc(58px + env(safe-area-inset-top));pointer-events:none;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:168px}
#phase i{width:10px;height:10px;border-radius:50%;margin-top:-3px}
#hull{display:flex}
#hearts{display:flex;flex-wrap:wrap;justify-content:flex-end;max-width:168px;box-sizing:border-box;gap:5px 4px;pointer-events:none;background:var(--pill-bg);border-radius:12px;padding:7px 9px;box-shadow:0 2px 0 var(--pill-shadow)}
#hearts[hidden]{display:none}
#hearts svg{display:block}
#hull[hidden]{display:none}
.hbar{width:48px;height:9px;border-radius:9px;background:var(--track);overflow:hidden;margin-top:-2px}
.hbar i{display:block;height:100%;border-radius:9px}
#wood,#phase,#market,#hull{
  background:var(--pill-bg);color:var(--pill-fg);border-radius:12px;padding:7px 11px 4px;font-size:13.5px;font-weight:800;line-height:1;
  display:flex;gap:6px;align-items:center;box-shadow:0 2px 0 var(--pill-shadow)}
#wood svg,#market svg{margin-top:-3px}
#market[hidden]{display:none}
.build{width:100%;margin-top:8px;background:var(--card);color:var(--card-fg);border-radius:11px;padding:9px 8px 8px 10px;text-align:left;
  display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 3px 0 rgba(0,0,0,.22)}
.build > span:first-child{display:flex;flex-direction:column;gap:3px;min-width:0}
.build b{font-size:15px;font-weight:800;line-height:1.05}
.build small{font-size:12.5px;font-weight:500;color:var(--muted);line-height:1.2}
.build .buy{margin:0;padding:8px 10px 5px;flex:none;max-width:48%;line-height:1.15}
.build[aria-disabled="true"] .buy{background:var(--track);color:var(--muted)}
.build[aria-disabled="true"]{cursor:default}
.build:active:not([aria-disabled="true"]){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
#order b{font-weight:800;opacity:.7}
#cast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:3;
  background:var(--buoy);color:var(--buoy-fg);font-weight:800;font-size:17px;height:46px;padding:3px 22px 0;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#cast:active{transform:translate(-50%,2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
#mend{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:3;
  background:var(--buoy);color:var(--buoy-fg);font-weight:800;font-size:17px;height:46px;padding:3px 22px 0;box-shadow:0 4px 0 rgba(0,0,0,.25);white-space:nowrap}
#mend:active{transform:translate(-50%,2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
#mend[aria-disabled="true"]{opacity:.75}
#rodcast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:3;
  background:var(--buoy);color:var(--buoy-fg);font-weight:800;font-size:17px;height:46px;padding:3px 22px 0;box-shadow:0 4px 0 rgba(0,0,0,.25);white-space:nowrap}
#rodcast:active{transform:translate(-50%,2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
#rodcast.bite{background:#F0C544;color:#2A1E08;animation:rodpulse .35s ease-in-out infinite alternate}
@keyframes rodpulse{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.08)}}
#aboard{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:3;
  background:var(--buoy);color:var(--buoy-fg);font-weight:800;font-size:17px;height:46px;padding:3px 22px 0;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#aboard:active{transform:translate(-50%,2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
#climb{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:3;
  background:#3E9E5C;color:#FFF6E5;font-weight:800;font-size:17px;height:46px;padding:3px 22px 0;box-shadow:0 4px 0 rgba(0,0,0,.25);white-space:nowrap}
#climb:active{transform:translate(-50%,2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
#leave{position:fixed;left:calc(14px + env(safe-area-inset-left));bottom:calc(170px + env(safe-area-inset-bottom));z-index:3;font-size:14px;height:38px;padding:3px 14px 0}
/* The throw button sits where a right thumb rests, clear of the stick's usual middle. */
#throw{position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(170px + env(safe-area-inset-bottom));z-index:3;width:68px;height:68px;border-radius:50%;
  background:var(--buoy);display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#throw[hidden]{display:none}
/* The seine's button, over the throw button: a ring round it shows how much seine is left once it is out. */
#seineBtn{position:fixed;right:calc(22px + env(safe-area-inset-right));bottom:calc(252px + env(safe-area-inset-bottom));z-index:3;width:60px;height:60px;border-radius:50%;
  background:#2F8A78;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#seineBtn[hidden]{display:none}
#seineBtn.out{background:radial-gradient(circle,#2F8A78 0 66%,transparent 67%),conic-gradient(#F2C14E calc(var(--left,1)*1turn),rgba(20,30,35,.55) 0)}
#seineBtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
#throw.harpoon{background:#2B5A73}
#throw.wait{opacity:.55}
#throw:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
/* A tab standing up off the plank sign's right corner, so it is there whenever the shop is. */
#shop .planks{position:relative}
#ashore{position:absolute;right:10px;top:-52px;background:var(--buoy);color:var(--buoy-fg);font-size:16px;height:42px;padding:3px 18px 0;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#ashore:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
#shop:not(.open) #ashore{visibility:hidden}
#guide{position:fixed;inset:0;z-index:5;overflow-y:auto;padding:calc(12px + env(safe-area-inset-top)) 10px calc(12px + env(safe-area-inset-bottom));background:rgba(8,30,40,.45);touch-action:pan-y}
#guide[hidden]{display:none}
#seamap,#aquarium{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:calc(12px + env(safe-area-inset-top)) 10px calc(12px + env(safe-area-inset-bottom));background:rgba(8,30,40,.55)}
#seamap[hidden],#aquarium[hidden]{display:none}
#seamap .planks,#aquarium .planks{width:min(560px,100%);padding:10px;box-sizing:border-box}
#seamap h2,#aquarium h2{font-size:16px;font-weight:800;margin:2px 4px 8px;line-height:1;display:flex;justify-content:space-between;align-items:center}
#seamap h2 .pill,#aquarium h2 .pill{height:32px;padding:0 10px}
#mapCanvas{position:static;inset:auto;display:block;margin:0 auto;border-radius:10px;background:#0B1C24;touch-action:auto;cursor:default}
#mapNote,#tankNote{margin:8px 4px 2px;font-size:13px;font-weight:700;text-align:center}
#tankCanvas{position:static;inset:auto;display:block;margin:0 auto;border-radius:10px;border:3px solid #3B4A4F;box-sizing:content-box;background:#3C9DB8;touch-action:none;cursor:pointer}
#aquaBtn[hidden],#baseBtn[hidden]{display:none}
#mapBtn{position:fixed;left:calc(14px + env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom));z-index:3;width:48px;height:48px;padding:0;display:grid;place-items:center}
#mapBtn[hidden]{display:none}
#mapPill{position:absolute;left:10px;top:-52px;font-size:16px;height:42px;padding:3px 16px 0;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#shop:not(.open) #mapPill{visibility:hidden}
#flagger{position:fixed;inset:0;z-index:5;overflow-y:auto;padding:calc(12px + env(safe-area-inset-top)) 10px calc(12px + env(safe-area-inset-bottom));background:rgba(8,30,40,.45);touch-action:pan-y}
#flagger[hidden]{display:none}
#flagger .planks{max-width:420px;margin:0 auto;padding:10px}
#flagger h2{font-size:16px;font-weight:800;margin:2px 4px 8px;line-height:1;display:flex;justify-content:space-between;align-items:center}
#flagger h2 .pill{height:32px;padding:0 10px}
#flagBig{display:flex;justify-content:center;margin:4px 0 6px}
#flagBig svg{border-radius:4px;box-shadow:0 3px 0 rgba(0,0,0,.25);width:150px;height:100px}
.frow{margin-top:8px}
.frow b{font-size:13px;font-weight:800;margin:0 4px}
.frow .swatches{margin-top:5px}
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin:5px 2px 0}
.fchip{width:48px;height:34px;border-radius:7px;background:var(--card);display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.22)}
.fchip.sel{outline:3px solid var(--coin);outline-offset:1px}
#flagger .go{display:block;margin:14px auto 4px;background:var(--buoy);color:var(--buoy-fg);font-weight:800;font-size:17px;padding:11px 26px 8px;border-radius:12px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair .build small{display:none}
.fmini{display:grid;place-items:center;flex:none}
.fmini svg{border-radius:2px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
#guide .planks{max-width:560px;margin:0 auto;padding:10px}
#guide h2{font-size:16px;font-weight:800;margin:2px 4px 8px;line-height:1;display:flex;justify-content:space-between;align-items:center}
#guide h2 .pill{height:32px;padding:0 10px}
.page{display:grid;grid-template-columns:44px 1fr;gap:3px 10px;background:var(--card);color:var(--card-fg);border-radius:11px;padding:9px 10px 8px;margin-top:8px}
.page svg{width:40px;height:26px;grid-row:span 3;align-self:start;margin-top:3px}
.page b{font-size:15px;font-weight:800;line-height:1.05}
.page small{font-size:12.5px;font-weight:500;color:var(--muted);line-height:1.25}
.page .facts{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:12px;font-weight:700;opacity:.85}
.page.unk{opacity:.65}
.page.gold{box-shadow:inset 0 0 0 2px var(--coin)}
#intro{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:rgba(8,30,40,.35)}
#intro.gone{display:none}
#intro .planks{max-width:340px;padding:22px 20px 18px;text-align:center}
#intro h1{font-size:40px;font-weight:800;line-height:.95;letter-spacing:-.5px;margin-bottom:12px}
#intro p{font-size:16px;font-weight:500;line-height:1.35;margin-bottom:6px}
#intro .go{margin-top:12px;background:var(--buoy);color:var(--buoy-fg);font-weight:800;font-size:18px;
  padding:13px 26px 9px;border-radius:12px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#intro .go:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
#intro .keys{font-size:13px;opacity:.75;margin:10px 0 0}
@media (hover:none){#intro .keys{display:none}}
@media (prefers-reduced-motion: reduce){.hold.full{animation:none}#shop,#toast,.track i{transition:none}}
</style>
</head>
<body>
<canvas id="sea" aria-label="Fishing game. Steer the boat, tow the net through fish, return to the dock."></canvas>

<div class="hud">
  <div class="pill" title="Coins"><i class="coin"></i><span id="coins">0</span></div>
  <div class="pill hold" id="holdPill" title="Hold">
    <svg width="22" height="14" viewBox="0 0 22 14" aria-hidden="true"><path d="M1 7c3-5 9-7 14-3l5-3v12l-5-3C10 14 4 12 1 7z" fill="currentColor"/></svg>
    <span id="holdTxt">0/12</span>
    <div class="track"><i id="holdBar"></i></div>
  </div>
  <div class="spacer"></div>
  <button class="pill icon label" id="keys" aria-label="Keys drive the boat" title="Keyboard steering" hidden>⌨ drive</button>
  <button class="pill icon" id="snd" aria-label="Sound on" title="Sound">♪</button>
  <button class="pill icon" id="rst" aria-label="Start over" title="Start over">↻</button>
</div>

<div id="order" aria-live="polite"></div>
<div id="rchips"><div id="hearts" title="Your hearts" hidden></div><div id="hull" title="Your boat's health" hidden></div><div id="market" title="The fishmonger's pick today" hidden></div><div id="phase"></div><div id="wood" title="Driftwood"></div></div>
<div id="toast" role="status"></div>
<button class="pill icon" id="mapBtn" aria-label="Sea map" title="Sea map"><svg width="24" height="22" viewBox="0 0 24 22" aria-hidden="true"><path d="M2 4l6-2 8 3 6-2v15l-6 2-8-3-6 2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8 2v15M16 5v15" stroke="currentColor" stroke-width="2"/></svg></button>
<button class="pill" id="cast" hidden>Cast · 10</button>
<button class="pill" id="mend" hidden>Mend the net</button>
<button class="pill" id="rodcast" hidden>Cast for lionfish</button>
<button class="pill" id="aboard" hidden>Back aboard</button>
<button class="pill" id="climb" hidden>Climb the tower</button>
<button class="pill" id="leave" hidden>Leave the tower</button>
<button id="seineBtn" hidden aria-label="Drop the seine"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M8 25 C2 17 6 6 17 6 C28 6 32 17 26 25" fill="none" stroke="#F2C14E" stroke-width="2.4" stroke-dasharray="0.1 4.4" stroke-linecap="round"/><path d="M17 26 L17 13" stroke="#FFF6E5" stroke-width="1.8"/><path d="M17 13 L24 15.5 L17 18 Z" fill="#FFF6E5"/><circle cx="17" cy="26" r="5.5" fill="#E4572E"/><rect x="11.5" y="25" width="11" height="2.2" fill="#FFF6E5"/></svg></button>
<button id="throw" hidden aria-label="Throw the spear"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M5 29 L25 9" stroke="#FFF6E5" stroke-width="3.2" stroke-linecap="round"/><path d="M22 6 L30 4 L28 12 Z" fill="#FFF6E5"/></svg></button>

<section id="shop" aria-hidden="true" aria-label="Upgrades">
  <div class="planks">
    <button class="pill" id="ashore" hidden>Step ashore</button>
    <button class="pill" id="mapPill">Sea map</button>
    <h2>Upgrades <span id="tierTxt"></span></h2>
    <div class="row">
      <button class="up" data-k="net"><b>Wider net</b><div class="pips"></div><small></small><div class="buy"></div></button>
      <button class="up" data-k="hold"><b>Bigger hold</b><div class="pips"></div><small></small><div class="buy"></div></button>
      <button class="up" data-k="engine"><b>Faster engine</b><div class="pips"></div><small></small><div class="buy"></div></button>
    </div>
    <div class="gearrow" id="gear" hidden></div>
    <button class="build" id="baseBtn" hidden></button>
    <button class="build" id="build"></button>
    <button class="build" id="aquaBtn" hidden></button>
    <div class="swatches" id="paints" role="group" aria-label="Paint"></div>
    <div class="log" id="log" aria-label="Catch log"></div>
    <div class="pair">
      <button class="build" id="guideBtn"><span><b>Field guide</b><small>Every fish you have met.</small></span><span class="buy">Open</span></button>
      <button class="build" id="flagBtn"><span><b>Your flag</b><small>Design the flag you fly.</small></span><span class="fmini" id="flagMini"></span></button>
    </div>
  </div>
</section>

<section id="flagger" hidden aria-label="Your flag">
  <div class="planks">
    <h2>Your flag <button class="pill icon" id="flagClose" aria-label="Close the flag designer">✕</button></h2>
    <div id="flagBig"></div>
    <div class="frow"><b>Colour</b><div class="swatches" id="fField" role="group" aria-label="Flag colour"></div></div>
    <div class="frow"><b>Pattern</b><div class="fchips" id="fPattern" role="group" aria-label="Pattern"></div></div>
    <div class="frow"><b>Second colour</b><div class="swatches" id="fAccent" role="group" aria-label="Second colour"></div></div>
    <div class="frow"><b>Emblem</b><div class="fchips" id="fEmblem" role="group" aria-label="Emblem"></div></div>
    <button class="go" id="flagDone">Fly it</button>
  </div>
</section>

<section id="aquarium" hidden aria-label="Your aquarium">
  <div class="planks">
    <h2>Your aquarium <button class="pill icon" id="tankClose" aria-label="Close the aquarium">✕</button></h2>
    <canvas id="tankCanvas"></canvas>
    <p id="tankNote"></p>
  </div>
</section>

<section id="seamap" hidden aria-label="Sea map">
  <div class="planks">
    <h2>Sea map <button class="pill icon" id="mapClose" aria-label="Close the sea map">✕</button></h2>
    <canvas id="mapCanvas"></canvas>
    <p id="mapNote"></p>
  </div>
</section>

<section id="guide" hidden aria-label="Field guide">
  <div class="planks">
    <h2>Field guide <button class="pill icon" id="guideClose" aria-label="Close the field guide">✕</button></h2>
    <div id="pages"></div>
  </div>
</section>

<div id="intro">
  <div class="planks">
    <h1>Net Profit</h1>
    <p>Drag anywhere to steer.</p>
    <p>Tow your net through the fish.</p>
    <p>Sail back to the dock to sell and upgrade.</p>
    <button class="go" id="go">Cast off</button>
    <p class="keys">Arrow keys and WASD work too.</p>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
