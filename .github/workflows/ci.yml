name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # A whole run takes a few minutes; past this something has hung.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      # The browser alone, without --with-deps: the runner already has every library
      # Chromium needs, and --with-deps only adds system fonts the tests do not use,
      # fetched from an Ubuntu mirror that has crawled (4 min 50 s for 21 MB on
      # 2026-10-08) and once hung a run for six hours (2026-10-07). The browser
      # itself comes from Playwright's CDN in seconds; a time limit and one retry
      # stay as a net in case that ever hangs too.
      - name: Install the test browser
        run: timeout 180 npx playwright install chromium || timeout 180 npx playwright install chromium
        timeout-minutes: 8
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
